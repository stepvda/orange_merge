# Orange Business portfolio structure for the Portfolio browser (/portfolio).
#
# Expresso tags offers and customer references with an SVP, and customer references with the
# offers they used, but it never says which offers make up a value proposition. That middle
# link is curated here, from docs/SVP_queries_v2.docx: each value proposition lists the Orange
# offers its opportunity ideas would be won with. Names are matched to Expresso offers by name
# (accents, case and punctuation ignored); a name that matches nothing is shown as unmatched.
# Offers tagged with an SVP that no value proposition claims appear under "Other offers".
#
# crm_svp / crm_families tie this structure to the Salesforce extract (data/crm_portfolio.json,
# built by `python -m radar.crm`): crm_svp is the CRM's name for the SVP (its opportunity
# figures are shown on the SVP), and crm_families are the CRM product families whose products
# are placed in that value proposition when they match an Expresso offer by name.

version: 2026-11-v2
# Language versions of one offer that share neither a current nor a past name in Expresso
# (records that do are merged automatically). Each entry lists the names of one offer.
offer_translations:
- [Professional Services on Evolution Platform, Services Professionnels sur Evolution Platform]
- [Multisourcing Service Integration, Multisourcing Service Integration (MSI)]
