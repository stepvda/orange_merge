# Radar runtime configuration.
# SC-10 / NFR-11: weights and thresholds are configuration, not code. Every
# published score records the `weight_set` id below (DR-05, §4.6 calibration
# drift guard). CHANGING ANY WEIGHT REQUIRES A NEW weight_set ID — scores across
# a version boundary are not comparable and the UI must not plot them together.

weight_set: "w-2026-08-a"
pipeline_version: "0.1.0"

# ---- Attractiveness (SC-01). Briefing's indicative figures; to be calibrated.
attractiveness_weights:
  market_signal_strength: 0.30
  source_diversity: 0.20
  evidence_quality: 0.20
  novelty_momentum: 0.15
  strategic_relevance: 0.15

# ---- Right to win (SC-12) — scored and displayed separately, never merged.
right_to_win_weights:
  offer_match: 0.25
  reference_density: 0.20
  partner_coverage: 0.15
  compliance_fit: 0.12
  capability_depth: 0.12
  external_validation: 0.08
  technology_ownership: 0.08

scoring:
  # Trailing window for signal-volume and momentum computation, in days.
  trailing_window_days: 90
  # Number of trailing periods used for the momentum slope.
  momentum_periods: 6
  # Log compression base for market signal strength (§4.6): prevents a single
  # noisy topic saturating the scale.
  signal_volume_log_base: 2.0
  # Evidence-quality floor penalty when no tier-1 or tier-2 evidence exists.
  no_credible_evidence_penalty: 0.45
  # §4.6 score-compression guard: the strategic-relevance rubric uses discrete
  # levels with anchors, mapped to numbers here rather than a free 0-100 ask.
  rubric_levels: {0: 0, 1: 20, 2: 40, 3: 60, 4: 80, 5: 100}

# ---- Lifecycle thresholds (§4.8, FR-09).
lifecycle:
  promote_to_active:
    min_signals: 4
    min_distinct_publishers: 3
    min_evidence_quality: 45
    require_non_tier4_evidence: true
  watchlist_min_signals: 1
  # Refresh periods without a qualifying signal before demotion.
  fading_after_periods: 1
  dormant_after_periods: 3
  # A period is one refresh cadence window.
  period_days: 14

# ---- Time horizon derivation (§4.8, FR-08).
horizon:
  now_max_months: 12
  next_max_months: 36
  # Published Orange commitment dates usable as anchors (§2.4 consequence 3).
  orange_anchors:
    "2028-12-31": "Trust the future 2028 revenue commitments"
    "2030-12-31": "Orange Cyberdefense €2bn; -45% GHG"
    "2040-12-31": "Net Zero Carbon"

# ---- Curation / specificity validation (§4.4, FR-06).
curation:
  # A candidate must resolve to exactly one vertical, use case and technology.
  require_exact_triple: true
  # Near-duplicate merge threshold on opportunity-statement embeddings (§4.4.5).
  # Lowered from 0.86 on 2026-11-25: at 0.86 the radar kept six confidential-
  # computing spaces and two rewordings of one smart-grid intrusion space.
  # Applied within a batch AND against the spaces already on the radar.
  duplicate_similarity_threshold: 0.80
  # Grey band below the threshold: pairs at or above this are put to the model
  # (prompts.same_opportunity_prompt) and merged if it says they are the same.
  duplicate_judge_floor: 0.75
  # A run may create at most this many NEW spaces per technology, so one hot
  # theme cannot flood the radar. The best by critic score are kept.
  max_new_per_technology: 2
  # Deterministic title rules (radar.pipeline.specificity). A title that breaks
  # one is sent back to the model once, then dropped.
  specificity:
    enabled: true
    # 22 (was 18): the title now names the use case and the technology too.
    max_title_words: 22
    # The title alone must answer vertical x use case x technology: the use
    # case and a concrete technology must both appear in it (2026-11-25).
    require_triple: true
    max_filler_words: 1
    max_why_now_chars: 150
    max_who_signs_chars: 70
  # Reject candidates that restate an offer already in data/portfolio.json
  # (radar.portfolio_overlap): multilingual embedding similarity of the
  # statement to each offer's name + headline (offers are mostly French).
  # Calibrated 2026-11-23 on 464 spaces: >=0.70 were mostly genuine
  # restatements, ~0.66 began to mix in false ones. Raise to reject less.
  portfolio_overlap:
    enabled: true
    similarity_threshold: 0.70
  # Generate screen, SVP filter (radar.svp). The SVPs overlap, so a candidate
  # is accepted when a requested SVP is among its `accept_rank` closest (on 28
  # typical statements: right SVP first 20 times, in the top two 25 times).
  # Clusters are read in order of how many of their signals sit closest to a
  # requested SVP; clusters with fewer than `min_cluster_signals` are skipped.
  svp_constraint:
    accept_rank: 2
    min_cluster_signals: 2
  # Statement length guards against both slogans and paragraphs.
  statement_min_chars: 40
  statement_max_chars: 180
  # Generic terms that fail specificity validation on their own.
  banned_generic_statements:
    - "ai"
    - "cloud"
    - "cybersecurity"
    - "digital transformation"
    - "5g"
    - "data"
    - "innovation"
    - "automation"
  # Over-produce then keep the best (§4.4.3 diversity by construction).
  candidates_per_cluster: 3
  # Least candidates each synthesis pass is asked to draft. 0 keeps the
  # original rule ("an empty list is a valid and often correct answer"), which
  # suits a strong model. A small model (qwen-fast, 2026-11-26) takes that as
  # the safe way out and returns nothing on every cluster; 1 asks it to draft
  # and leaves the filtering to the critic, title lint and entailment, which
  # run unchanged. Harmless with a strong model, which drafts anyway.
  min_candidates_per_pass: 1
  # Raised from 3 on 2026-11-25: the rubric defines 3 as "the statement is
  # vague", and 20 of the first 75 spaces were accepted at 3.
  critic_min_score: 4   # of 5; a revised title is re-judged once, then dropped

# ---- Clustering (stage 4).
clustering:
  # Deterministic agglomerative clustering — reproducibility is a requirement
  # (SC-11), so no randomised initialisation is used.
  # Tightened from 0.62. Finer clusters are not merely more numerous — they are
  # more specific themes, and specificity is the property the briefing insists
  # on. A broad cluster invites a broad candidate, which the critic then rejects.
  distance_threshold: 0.58
  # Still 3. A two-item "theme" is the one-off signal SC-09 says must score low,
  # and feeding it to synthesis manufactures exactly the thin topic the critic
  # exists to catch. Lowering this would buy topic count at the cost of the bar.
  min_cluster_size: 3
  # Raised from 120, which was binding: 80 clusters formed from 2,064 relevant
  # signals, and the corpus is now several times that. A cap that silently
  # truncates the tail hides evidenced themes rather than prioritising them.
  max_clusters: 400

# ---- Evidence enrichment (§4.4.5 "new signals attach to the existing topic").
enrichment:
  # Cosine similarity between the topic statement and the signal span.
  similarity_threshold: 0.45
  # Cap per topic per refresh, so one broad topic cannot absorb the corpus and
  # distort the cross-topic normalisation that market signal strength uses.
  max_new_signals_per_topic: 12
  # Similarity alone is not evidence: embeddings rate unrelated security items
  # as close. A second, independent reason is required — a vocabulary term in
  # the signal text, or a CPV crosswalk hit.
  require_taxonomy_corroboration: true

# ---- Collaboration workflow (FR-25, §4.10).
workflow:
  # Points of difference between an external score and the internal assessment
  # axis that should know better, above which a review is triggered (§4.10 model C:
  # "divergence ... is surfaced as a review trigger").
  divergence_threshold: 30.0
  min_assessments_for_conviction: 1
  # §4.10's named weakness of the stage gate is latency — "a topic can die
  # waiting". Past this, the topic is flagged as stalled.
  stale_in_stage_days: 30

# ---- Competitive intensity (§4.3.3 "award notices reveal who is winning").
competition:
  # The intensity score is computed from the competitor register, not judged:
  # each competitor matched to a topic contributes its type weight, doubled when
  # the corpus actually mentions it in that topic's evidence rather than merely
  # implying it structurally.
  evidenced_multiplier: 2.0
  # How specifically a competitor matches this space. The spread is deliberately
  # wide: "sells this exact technology" is a competitive fact, while "operates
  # somewhere in cybersecurity" is true of most of the register and must not be
  # allowed to make every security topic read HIGH.
  match_weights:
    technology: 1.0
    vertical: 0.4
    domain: 0.15
  # Score bands over the LISTED competitors. One specialist selling this exact
  # technology contributes about 1.0 structurally and about 2.0 when the corpus
  # names it, so the thresholds read as "how many players of substance":
  #   none    nothing in the register plausibly plays here
  #   low     one or two adjacent players
  #   medium  three to five, at least one the customer already knows
  #   high    a crowded field with heavyweights visible in the evidence
  bands:
    none: 0.0
    low: 1.0
    medium: 3.0
    high: 7.5
  # Competitors listed per topic. Beyond this the list stops being a briefing
  # and starts being a directory.
  max_listed: 8

# ---- Long-form descriptions and briefs (FR-14, FR-18).
description:
  # One model call per topic whose version has moved. A synthesis round bumps
  # most versions, so an uncapped stage would spend hundreds of calls on a
  # routine refresh without anyone asking for it. NFR-10 makes inference cost a
  # reported quantity, and §4.12's rule applies to the cap itself: what was left
  # ungenerated is logged, never silently dropped.
  # Raised from 40 on 2026-11-25: every space should have its description
  # before anyone opens it. Generation runs also describe what they create.
  max_per_refresh: 500
  # Topics described concurrently. Each is one independent call.
  max_parallel: 4

# ---- Serving (FR-21, AC-05, NFR-09).
serving: {}   # role modes, the per-view cap and the exploration slot were removed on 2026-11-23

# ---- Ingestion guards (DR-08, NFR-07).
ingestion:
  user_agent: "OrangeInnovationRadar/0.1 (research prototype; contact configured in .env)"
  request_timeout_seconds: 45
  max_retries: 3
  retry_backoff_seconds: 5
  # Longest Retry-After a source may ask for. A source asking for more (a spent
  # daily quota: OpenAlex once asked for 10.5 hours) is skipped for the rest of
  # the refresh instead of stalling it.
  max_retry_after_seconds: 120
  # Stored extract length. Storage is by reference plus short extract, never a
  # full mirror of source content (DR-08).
  max_extract_chars: 1200
  # Retain raw archives so the pipeline can be replayed as of a past date
  # without re-fetching (DR-14, FR-35).
  archive_raw: true
  # Sources are independent and network-bound, so they are fetched concurrently.
  # Database writes stay serial (see Ingestor.collect). Raising this past ~8
  # buys little: the slowest single source, not the sum, sets the floor.
  max_parallel_sources: 8

llm:
  temperature_synthesis: 0.85   # over-produce deliberately (§4.4.3)
  temperature_critic: 0.10
  temperature_classify: 0.0
  max_retries: 2
  # Requests per batch for the cheap classification stages.
  classify_batch_size: 12
  # Clusters synthesised concurrently. Each cluster issues candidates_per_cluster
  # generation calls plus a critic and entailment call per candidate, so this
  # multiplies into real concurrency against the provider — raise with care.
  # Lowered from 4 on 2026-11-26: 4 clusters x 3 passes outran a 60 requests/
  # minute endpoint and passes failed on 429s. The hard ceiling is
  # RADAR_LLM_MAX_RPM in .env (radar.llm), which every call respects.
  max_parallel_clusters: 2

# ---- Competitor profiling (§4.3.3 extension).
#
# The register says what a competitor sells. A profile says what they say they
# sell, in their own words, with the page that said it. That is weaker evidence
# than a tender notice and stronger than an assumption, and it is treated
# accordingly: a competitor's own site is TIER 4 everywhere it is scored, and it
# is never allowed to lift attractiveness on its own (SC-09).
competitor_intel:
  # Pages retained per competitor. The sitemap of a global integrator runs to
  # tens of thousands of URLs; what is wanted is the part that says what they
  # sell and to whom, not the newsroom.
  max_pages_per_competitor: 40
  # Child sitemaps read from a sitemap index before giving up on it.
  max_sitemaps_per_competitor: 12
  # Seconds between requests to one host. Deliberately slower than the signal
  # connectors: these are not APIs offered for consumption, and the profiler
  # runs rarely.
  min_interval_seconds: 2.0
  # Competitors crawled concurrently. Per-host pacing is unaffected.
  max_parallel_competitors: 8
  # Stored text per page. DR-08 applies here exactly as it does to signals:
  # by reference plus an extract, never a mirror.
  max_page_chars: 6000
  # URL path fragments worth reading — what the company sells, to whom.
  include_patterns:
    - solution
    - industr
    - product
    - service
    - platform
    - what-we-do
    - use-case
    - capabilit
    - offering
    - customer-stor
    - case-stud
    - success-stor
    - client-stor
  # Never worth reading: newsroom churn, legal boilerplate, hiring.
  exclude_patterns:
    - /blog/
    - /insight
    - /expert-perspective
    - /perspective
    - /viewpoint
    - /thought-leadership
    - /news/
    - /press
    - /career
    - /job
    - /legal
    - /privacy
    - /cookie
    - /terms
    - /investor
    - /event
    - /webinar
    - /podcast
    - /author/
    - /tag/
    - /search
    - /docs
    - /documentation
    - /support
    - /help
    - /api
    - /developer
    - /changelog
    - /glossary
    - /resource
    - /library
    - /login
    - /contact
    - .pdf
    - .zip
    - .jpg
    - .png
  # Profiles generated per run. One model call each.
  max_profiles_per_run: 70
  max_parallel_profiles: 4
  # Per-topic competitor analysis. The structural join is free; only the
  # comparative narrative costs a call, so it is capped like descriptions are.
  max_analyses_per_run: 40
  max_parallel_analyses: 4

# ---- AI footprint ledger (radar.footprint) — ported from the HuMaSoo team's
# CodeCarbon/EcoLogits instrumentation, see docs/best_of_selection.md.
# Token counts are exact (returned by the provider); energy is an ESTIMATE from
# the per-token factors below and is shown in the UI with these factors beside
# it. Changing a factor changes every reported figure, so bump `version`.
footprint:
  version: "fp-2026-11-a"
  # Inference energy per 1,000 tokens at the accelerator, before data-centre
  # overhead. Order-of-magnitude figures for a large hosted model (tens of
  # billions of active parameters), in line with published per-query estimates
  # (EcoLogits methodology; Luccioni et al. 2024). Prefill (prompt) tokens are
  # processed in parallel and cost roughly an order of magnitude less than
  # generated tokens.
  wh_per_1k_prompt_tokens: 0.1
  wh_per_1k_completion_tokens: 2.0
  # Data-centre power usage effectiveness.
  pue: 1.2
  # Grid carbon intensity of the inference location, g CO2e per kWh. 400 is a
  # world-average order; set ~250 for an EU-hosted or ~50 for a French
  # (sovereign) deployment — the sovereign option is itself a footprint lever.
  grid_gco2e_per_kwh: 400
  basis: >-
    Estimated, not metered: exact token counts × stated per-token energy
    factors × PUE × grid intensity. Calibrate against provider disclosures.

# ---- Taxonomy watchlist (radar.taxonomy_watch) — ported from Orange_use_case.
taxonomy_watch:
  # A term the model has reached for this many times is shown as "proposed".
  proposal_threshold: 2
  # Never recorded: too generic to ever become a vocabulary entry.
  generic_terms: [ai, artificial intelligence, machine learning, data, digital, cloud]
